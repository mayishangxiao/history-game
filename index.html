<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<title>历史游戏</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	height: 100%;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
	overscroll-behavior: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* ===== 移动端横屏引导遮罩 ===== */
#orient-overlay {
	position: fixed;
	left: 0;
	top: 0;
	right: 0;
	bottom: 0;
	background: rgba(8, 8, 10, 0.88);
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	z-index: 9999;
	color: #e8d9a8;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	text-align: center;
	padding: 24px;
}

#orient-overlay .phone {
	width: 56px;
	height: 100px;
	border: 3px solid #e8d9a8;
	border-radius: 10px;
	position: relative;
	margin-bottom: 26px;
	animation: phone-rotate 1.6s ease-in-out infinite;
}

#orient-overlay .phone::before {
	content: '';
	position: absolute;
	left: 50%;
	transform: translateX(-50%);
	top: 8px;
	width: 18px;
	height: 4px;
	border-radius: 2px;
	background: #e8d9a8;
}

#orient-overlay .phone::after {
	content: '';
	position: absolute;
	left: 50%;
	transform: translateX(-50%);
	bottom: 8px;
	width: 10px;
	height: 10px;
	border-radius: 50%;
	border: 2px solid #e8d9a8;
}

@keyframes phone-rotate {
	0%   { transform: rotate(0deg); }
	45%  { transform: rotate(90deg); }
	100% { transform: rotate(90deg); }
}

#orient-overlay .orient-title {
	font-size: 26px;
	letter-spacing: 3px;
	margin-bottom: 12px;
}

#orient-overlay .orient-sub {
	font-size: 15px;
	color: #9b937c;
}

/* 触屏设备竖屏时自动显示遮罩（纯CSS媒体查询，不依赖JS，兼容所有手机浏览器） */
@media (pointer: coarse) and (orientation: portrait) {
	#orient-overlay { display: flex !important; }
}
@media (hover: none) and (orientation: portrait) {
	#orient-overlay { display: flex !important; }
}
/* 测试用：URL 加 ?portrait=1 可强制显示遮罩 */
body.force-portrait #orient-overlay { display: flex !important; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="orient-overlay">
			<div class="phone"></div>
			<div class="orient-title">请横屏游玩</div>
			<div class="orient-sub">旋转手机至横向，享受最佳体验</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":20930032,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());

	// ===== 移动端自动横屏（全屏+方向锁定）=====
	// screen.orientation.lock 必须在全屏下才生效，首次交互时先全屏再锁横屏
	(function () {
		if (location.search.indexOf('portrait=1') >= 0) {
			document.body.classList.add('force-portrait');
		}
		var _locked = false;
		function lockOrientation() {
			try {
				if (screen.orientation && typeof screen.orientation.lock === 'function') {
					var p = screen.orientation.lock('landscape');
					if (p && typeof p.catch === 'function') p.catch(function () {});
				}
			} catch (e) {}
		}
		function enterFullscreenAndLock() {
			if (_locked) return;
			_locked = true;
			var elem = document.documentElement;
			var fsMethod = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.msRequestFullscreen;
			if (!fsMethod) { lockOrientation(); return; }
			var done = false;
			var finish = function (ok) {
				if (done) return; done = true;
				if (ok) setTimeout(lockOrientation, 150); else lockOrientation();
			};
			try {
				var result = fsMethod.call(elem);
				if (result && typeof result.then === 'function') {
					result.then(function () { finish(true); }).catch(function () { finish(false); });
				} else {
					var onFs = function () {
						document.removeEventListener('fullscreenchange', onFs);
						document.removeEventListener('webkitfullscreenchange', onFs);
						finish(!!(document.fullscreenElement || document.webkitFullscreenElement));
					};
					document.addEventListener('fullscreenchange', onFs);
					document.addEventListener('webkitfullscreenchange', onFs);
					setTimeout(function () { finish(false); }, 1500);
				}
			} catch (e) { finish(false); }
		}
		var handler = function () {
			enterFullscreenAndLock();
			window.removeEventListener('pointerdown', handler);
			window.removeEventListener('keydown', handler);
			window.removeEventListener('touchstart', handler);
		};
		window.addEventListener('pointerdown', handler);
		window.addEventListener('keydown', handler);
		window.addEventListener('touchstart', handler);
		var canvas = document.getElementById('canvas');
		if (canvas) canvas.addEventListener('pointerdown', function () {
			if (!_locked) enterFullscreenAndLock();
		});
	}());
		</script>
	</body>
</html>
